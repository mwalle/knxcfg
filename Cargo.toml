[workspace]
resolver = "2"
members = [
    "crates/knx-core",
    "crates/knx-store",
    "crates/knx-prod",
    "crates/knx-form",
    "crates/knx-transport",
    "crates/knxcfg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
quick-xml = "0.36"
zip = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
